[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "hdr-hybrid-fusion"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "Pillow>=10.0", "opencv-python>=4.8", "tifffile>=2024.1.0"]
[project.optional-dependencies]
test = ["pytest>=8.0"]
raw = ["rawpy>=0.19", "imageio>=2.31"]
train = ["torch>=2.2", "torchvision>=0.17"]
[tool.pytest.ini_options]
pythonpath = ["src"]
